<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acces shop - Spektr</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png" />
    <style>
      :root {
        --pink: #ff3fa6;
        --muted: rgba(255, 255, 255, 0.66);
        --line: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #fff;
        background:
          radial-gradient(circle at 72% 30%, rgba(255, 63, 166, 0.24), transparent 30rem),
          linear-gradient(135deg, #000 0%, #090006 52%, #230516 100%);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }

      .site-header {
        position: fixed;
        z-index: 10;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 74px;
        padding: 0 30px;
        background: rgba(0, 0, 0, 0.86);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(14px);
      }

      .brand img {
        display: block;
        width: 42px;
        height: auto;
      }

      .nav-link {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        border-bottom: 3px solid var(--pink);
        padding-bottom: 5px;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 112px 22px 38px;
      }

      .shop-card {
        width: min(1180px, 100%);
        min-height: 640px;
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(320px, 0.8fr);
        overflow: hidden;
        border: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.34)),
          rgba(0, 0, 0, 0.78);
      }

      .shop-copy {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: clamp(32px, 5vw, 72px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--pink);
        font-size: clamp(13px, 1vw, 16px);
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(58px, 11vw, 148px);
        line-height: 0.86;
      }

      .intro {
        max-width: 570px;
        margin: 26px 0 34px;
        color: var(--muted);
        font-size: clamp(15px, 1.4vw, 22px);
        line-height: 1.28;
        text-transform: none;
      }

      .cta {
        width: fit-content;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 0 18px;
        color: #000;
        background: #fff;
        border-radius: 999px;
        border: 1px solid #fff;
        text-decoration: none;
        font-size: 15px;
      }

      .cta span {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid #111;
        border-radius: 999px;
      }

      .shop-visual {
        position: relative;
        min-height: 640px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 52% 52%, rgba(255, 63, 166, 0.32), transparent 22rem),
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent);
      }

      .shop-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 38px 38px;
        opacity: 0.32;
      }

      .shop-visual img {
        position: relative;
        z-index: 1;
        width: min(440px, 82%);
        height: auto;
        filter: drop-shadow(0 34px 70px rgba(0, 0, 0, 0.72));
      }

      footer {
        position: fixed;
        left: 30px;
        bottom: 22px;
        color: rgba(255, 255, 255, 0.48);
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .site-header {
          height: 66px;
          padding: 0 18px;
        }

        .brand img {
          width: 38px;
        }

        main {
          padding-top: 88px;
        }

        .shop-card {
          min-height: auto;
          grid-template-columns: 1fr;
        }

        .shop-copy {
          min-height: 360px;
          padding: 28px;
        }

        .shop-visual {
          min-height: 360px;
          order: -1;
        }

        .shop-visual img {
          width: min(320px, 82%);
        }

        footer {
          position: static;
          padding: 0 22px 22px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="Retour au teaser Spektr">
        <img src="../assets/spektr-crest.png" alt="Spektr" />
      </a>
      <a class="nav-link" href="https://wearespektr.com/shop">Shop</a>
    </header>

    <main>
      <section class="shop-card" aria-label="Acces a l'ancien shop Spektr">
        <div class="shop-copy">
          <p class="eyebrow">Boutique officielle</p>
          <h1>Acces shop</h1>
          <p class="intro">Le nouveau site arrive bientot. En attendant, la boutique reste accessible sur l'ancien shop Spektr.</p>
          <a class="cta" href="https://wearespektr.com/shop">
            Ouvrir le shop
            <span aria-hidden="true">-&gt;</span>
          </a>
        </div>
        <div class="shop-visual" aria-hidden="true">
          <img src="../assets/product-vdaty-back-transparent.png" alt="" />
        </div>
      </section>
    </main>

    <footer>2026 SPEKTR</footer>
  </body>
</html>
